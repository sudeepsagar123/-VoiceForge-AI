# VITS2 Configuration — Kannada
# ================================================

model:
  name: "vits2_kannada"
  type: "vits2"

  text_encoder:
    vocab_size: 512          # Larger vocab for Kannada Unicode
    hidden_dim: 192
    ffn_dim: 768
    num_heads: 2
    num_layers: 6
    dropout: 0.1
    kernel_size: 3

  posterior_encoder:
    in_channels: 513
    hidden_dim: 192
    out_channels: 192
    kernel_size: 5
    dilation_rate: 1
    num_layers: 16

  flow:
    hidden_dim: 192
    kernel_size: 5
    dilation_rate: 1
    num_layers: 4
    num_flows: 4

  duration_predictor:
    hidden_dim: 192
    kernel_size: 3
    dropout: 0.5
    num_flows: 4

  generator:
    initial_channels: 512
    resblock_type: "1"
    resblock_dilation_sizes: [[1, 3, 5], [1, 3, 5], [1, 3, 5]]
    resblock_kernel_sizes: [3, 7, 11]
    upsample_rates: [8, 8, 2, 2]
    upsample_initial_channel: 512
    upsample_kernel_sizes: [16, 16, 4, 4]

  discriminator:
    periods: [2, 3, 5, 7, 11]
    use_spectral_norm: false

audio:
  sample_rate: 22050
  n_fft: 1024
  hop_length: 256
  win_length: 1024
  n_mels: 80
  mel_fmin: 0.0
  mel_fmax: null
  segment_size: 8192

training:
  batch_size: 16
  learning_rate: 2.0e-4
  betas: [0.8, 0.99]
  eps: 1.0e-9
  weight_decay: 0.01
  epochs: 1000
  lr_decay: 0.999875
  fp16: true
  seed: 42
  save_every_n_epochs: 10
  eval_every_n_epochs: 5
  keep_last_n_checkpoints: 5
  loss_weights:
    mel: 45.0
    kl: 1.0
    duration: 1.0
    generator: 1.0
    feature_matching: 2.0

data:
  train_filelist: "data/kannada/tts/train.txt"
  val_filelist: "data/kannada/tts/val.txt"
  language: "kn"
  use_phonemes: false        # Use character-level for Kannada Unicode
  text_cleaners: ["kannada_cleaners"]
  max_text_length: 300
  max_audio_length: 15.0
  inference:
    max_chars_per_chunk: 200
    crossfade_ms: 50
    speed: 1.0

paths:
  checkpoint_dir: "checkpoints/tts_kannada"
  log_dir: "logs/tts_kannada"
  output_dir: "outputs/tts_kannada"
